def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY');
def buildAsApplication = !buildAsLibrary
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}

// Dev builds: arm64 only. Release builds: all ABIs.
// Override with: ./gradlew assembleDebug -PabiFilters=arm64-v8a,x86_64
def isReleaseBuild = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
def devAbis = project.hasProperty('abiFilters') ? project.property('abiFilters').split(',') as List : ['arm64-v8a']
def releaseAbis = ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64']

android {
    buildFeatures {
        buildConfig = true
    }

    // Fix Kotlin stdlib version conflicts from Material Design dependencies
    // In Kotlin 2.x, jdk7/jdk8 variants merged into main stdlib
    configurations.all {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-stdlib:2.3.0'
        }
    }
    ndkVersion = "26.0.10792818"
    compileSdk = 33
    defaultConfig {
        if (buildAsApplication) {
            applicationId = "com.dishii.mm"
            namespace = "com.dishii.mm"
        }
        minSdk = 24
        targetSdk = 33
        versionCode = 6
        versionName = "3.0.1"
        externalNativeBuild {
            //ndkBuild {
            //    arguments "APP_PLATFORM=android-23"
            //    abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            //}
            cmake {
                 arguments "-DSDL_SHARED=ON", "-DANDROID_STL=c++_static", "-DHAVE_LD_VERSION_SCRIPT=OFF", "-DUSE_OPENGLES=ON", "-DCMAKE_CXX_FLAGS=-Wno-macro-redefined", "-DCMAKE_C_FLAGS=-Wno-macro-redefined"
                 if (isReleaseBuild) {
                     abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                 } else {
                     abiFilters devAbis.toArray(new String[0])
                 }
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            //ndkBuild {
            //    path 'jni/Android.mk'
            //}
            cmake {
                 path = '../../CMakeLists.txt'
                 version = '3.31.6'
            }
        }
       
    }
    lint {
        abortOnError = false
    }
    
    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "org.libsdl.app.aar";
                    output.outputFile = new File(outputFile.parent, fileName);
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.core:core:1.7.0' // Use the latest version
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.activity:activity:1.7.2'
}

task wrapper(type: Wrapper) {
    gradleVersion = '8.3.2'
}

task prepareKotlinBuildScriptModel {
}
